<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>画面</title>
<style>
:root{color-scheme:light dark;--surround:#2F2B29;--dock-h:88px;--w:min(calc(100vw - 32px),calc((100vh - 24px - var(--dock-h))*16/9));--edge:none}
@media (prefers-color-scheme:dark){:root{--edge:0 0 0 .5px rgba(255,255,255,.14)}}
html,body{height:100%;margin:0;overflow:hidden;background:var(--surround)}
/* 选中框是柠檬黄，上面的字要深色 */
:root .dme,:root .dme-dock{--dme-accent:#E4F56B}
:root .dme-size,:root .dme-b[aria-pressed=true],:root .dme-span{color:#141414}
#wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#stage{position:relative;flex:none;width:var(--w);aspect-ratio:16/9;background:#000;box-shadow:var(--edge);border-radius:4px;overflow:hidden}
#dock{flex:none;width:var(--w);height:var(--dock-h);overflow:hidden;box-sizing:border-box}
#dock:has(.dme-panel:not([style*="display: none"])){padding:6px 12px;border-radius:18px;background:color-mix(in srgb,Canvas 62%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);box-shadow:inset 0 .5px 0 rgba(255,255,255,.5),inset 0 0 0 .5px rgba(127,127,127,.18),0 6px 18px rgba(0,0,0,.1)}
#cv{display:block;width:100%;height:100%}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:32px;text-align:center;color:#f5f5f7;background:rgba(0,0,0,.72);font:14px/1.5 -apple-system,"PingFang SC",sans-serif;z-index:5}
#err[hidden]{display:none}
</style>
</head>
<body>
<div id="wrap">
<div id="stage"><canvas id="cv" width="1280" height="720" aria-label="动效预览画面"></canvas><div id="err" role="alert" hidden></div></div>
<div id="dock" aria-label="元素属性和时间"></div>
</div>
<!--SCRIPTS-->
</body>
</html>
